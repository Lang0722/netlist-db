[package]
name = "netlist-query"
description = "Query engine over HSPICE netlists for LLM tools"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
rustc-hash = { workspace = true }
netlist-db = { path = ".." }
netlist-expr = { path = "../expr" }
# `HashTable` for the interner (no default hasher: the interner hashes)
hashbrown = { version = "0.17", default-features = false }
serde.workspace = true
tokio.workspace = true

[dev-dependencies]
serde_json.workspace = true
# peak RSS in the perf gate (`getrusage`)
libc = "0.2"
