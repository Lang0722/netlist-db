[workspace]
members = ["pybind", "macros", "expr", "query"]
[workspace.package]
version = "0.4.10"
edition = "2024"
license = "MIT"
authors = ["Junzhuo <zhou@junzhuo.site>"]
keywords = ["eda", "spice", "netlist", "database", "parser"]
readme = "README.md"
repository = "https://github.com/zao111222333/netlist-db/"
documentation = "https://docs.rs/netlist-db"
categories = ["development-tools"]
description = "Concurrent/Parallel SPICE (HSPICE) parser."

[workspace.dependencies]
serde_json = "1.0"
pyo3 = "0.27"
pyo3-stub-gen = { version = "0.17", default-features = false }
tokio = { version = "1.47", features = ["fs", "sync", "rt", "rt-multi-thread", "macros", "time"] }
simple_logger = "5.0.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4.28"
fast-float2 = "0.2.3"
indexmap = "2.11"
rustc-hash = "2"
nom = "8"
nom_locate = "5"
regex = "1.11"
thiserror = "2"
nu-ansi-term = "0.50"
colored = "3"
itertools = "0.14"
tracing = "0.1.41"
tracing-subscriber = { version="0.3.0", features=["chrono"] }

[package]
name = "netlist-db"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
keywords.workspace = true
readme.workspace = true
repository.workspace = true
documentation.workspace = true
categories.workspace = true
description.workspace = true
include = ["/src", "/examples", "README.md"]

[features]
py = ['dep:pyo3', 'dep:pyo3-stub-gen']
tracing = ["dep:tracing"]

[dependencies]
netlist-macros = { path = "macros" }
netlist-expr = { path = "expr" }
fast-float2.workspace = true
indexmap.workspace = true
rustc-hash.workspace = true
log.workspace = true
nom.workspace = true
nom_locate.workspace = true
regex.workspace = true
serde.workspace = true
thiserror.workspace = true
itertools.workspace = true
tokio.workspace = true
nu-ansi-term.workspace = true
colored.workspace = true
pyo3 = { workspace = true, optional = true }
pyo3-stub-gen = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
simple_logger.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = "0.1.43"