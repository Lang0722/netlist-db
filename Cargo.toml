[workspace]
members = ["pybind", "macros", "expr", "query"]
[workspace.package]
version = "0.4.10"
edition = "2024"
# The toolchain of the CI (`RUST_VERSION` in `.github/workflows`): cargo locks
# versions that it builds. `query` and `pybind` do not set it: `query` has an
# `if let` guard, which is newer.
rust-version = "1.88"
license = "MIT"
authors = ["Junzhuo <zhou@junzhuo.site>"]
keywords = ["eda", "spice", "netlist", "database", "parser"]
readme = "README.md"
repository = "https://github.com/zao111222333/netlist-db/"
documentation = "https://docs.rs/netlist-db"
categories = ["development-tools"]
description = "Concurrent/Parallel SPICE (HSPICE) parser."

[workspace.dependencies]
serde_json = "1.0"
pyo3 = "0.30"
tokio = { version = "1.47", features = ["fs", "sync", "rt", "rt-multi-thread", "macros", "time"] }
serde = { version = "1.0", features = ["derive"] }
log = "0.4.28"
fast-float2 = "0.2.3"
indexmap = "2.11"
rustc-hash = "2"
nom = "8"
nom_locate = "5"
tracing = { version = "0.1.41", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.0", default-features = false, features = ["fmt"] }

[package]
name = "netlist-db"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
keywords.workspace = true
readme.workspace = true
repository.workspace = true
documentation.workspace = true
categories.workspace = true
description.workspace = true
include = ["/src", "/examples", "README.md"]

[features]
py = ['dep:pyo3']
tracing = ["dep:tracing"]

[dependencies]
netlist-macros = { path = "macros" }
netlist-expr = { path = "expr" }
fast-float2.workspace = true
indexmap.workspace = true
rustc-hash.workspace = true
log.workspace = true
nom.workspace = true
nom_locate.workspace = true
serde.workspace = true
tokio.workspace = true
pyo3 = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
tracing-subscriber.workspace = true

# the allocator of the example `parser_multi`
[target.'cfg(target_env = "musl")'.dev-dependencies]
mimalloc = "0.1.43"